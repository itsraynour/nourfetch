name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo Check
        run: cargo check --verbose

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Cargo Build Release
        run: cargo build --release --verbose

      - name: Run Self Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/release/nourfetch.exe --version
            ./target/release/nourfetch.exe --json
          else
            ./target/release/nourfetch --version
            ./target/release/nourfetch --json
          fi
